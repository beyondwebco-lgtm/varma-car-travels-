<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 95" width="100%" height="100%">
  <defs>
    <linearGradient id="embGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#F5B800"/>
      <stop offset="70%" stop-color="#D99000"/>
      <stop offset="100%" stop-color="#9C5A00"/>
    </linearGradient>
    <linearGradient id="embSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D99000"/>
      <stop offset="50%" stop-color="#FFEFA8"/>
      <stop offset="100%" stop-color="#D99000"/>
    </linearGradient>
    <filter id="embGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M 45 4 L 82 16 C 82 52 66 78 45 91 C 24 78 8 52 8 16 Z" 
        fill="#11151F" stroke="url(#embGold)" stroke-width="2.5" />
  <path d="M 45 11 L 75 21 C 75 49 61 70 45 82 C 29 70 15 49 15 21 Z" 
        fill="#07090E" stroke="url(#embSheen)" stroke-width="1" opacity="0.7"/>

  <!-- Stylized Luxury Car Silhouette -->
  <path d="M 23 48 C 26 44 32 36 38 34 C 42 33 55 33 59 36 C 63 38 68 44 70 48 L 73 52 C 73 54 72 56 70 56 L 68 56 C 67 53 64 51 61 51 C 58 51 55 53 54 56 L 36 56 C 35 53 32 51 29 51 C 26 51 23 53 22 56 L 20 56 C 18 56 17 54 18 52 Z" 
        fill="url(#embGold)" filter="url(#embGlow)"/>

  <!-- Wheels -->
  <circle cx="29" cy="56" r="3.5" fill="#FFEFA8" stroke="#111" stroke-width="1.5"/>
  <circle cx="61" cy="56" r="3.5" fill="#FFEFA8" stroke="#111" stroke-width="1.5"/>

  <!-- Speed Wings -->
  <path d="M 25 38 C 35 34 55 34 65 38" stroke="url(#embGold)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 16 63 L 74 63" stroke="url(#embSheen)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stars -->
  <polygon points="45,67 47,72 52,72 48,75 50,80 45,77 40,80 42,75 38,72 43,72" fill="url(#embGold)"/>
  <polygon points="32,69 33.5,72.5 37,72.5 34,74.5 35.5,78 32,76 28.5,78 30,74.5 27,72.5 30.5,72.5" fill="url(#embGold)" transform="scale(0.85) translate(6, 10)"/>
  <polygon points="58,69 59.5,72.5 63,72.5 60,74.5 61.5,78 58,76 54.5,78 56,74.5 53,72.5 56.5,72.5" fill="url(#embGold)" transform="scale(0.85) translate(11, 10)"/>
</svg>
