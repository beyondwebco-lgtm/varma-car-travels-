<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#F5B800"/>
      <stop offset="70%" stop-color="#D99000"/>
      <stop offset="100%" stop-color="#9C5A00"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D99000"/>
      <stop offset="50%" stop-color="#FFEFA8"/>
      <stop offset="100%" stop-color="#D99000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem / Shield -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield Crest -->
    <path d="M 45 5 L 80 16 C 80 50 65 75 45 88 C 25 75 10 50 10 16 Z" 
          fill="#11151F" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M 45 12 L 73 21 C 73 48 60 68 45 79 C 30 68 17 48 17 21 Z" 
          fill="#0B0D13" stroke="url(#goldSheen)" stroke-width="1" opacity="0.6"/>
    
    <!-- Stylized Luxury Car Silhouette -->
    <path d="M 23 48 C 26 44 32 36 38 34 C 42 33 55 33 59 36 C 63 38 68 44 70 48 L 73 52 C 73 54 72 56 70 56 L 68 56 C 67 53 64 51 61 51 C 58 51 55 53 54 56 L 36 56 C 35 53 32 51 29 51 C 26 51 23 53 22 56 L 20 56 C 18 56 17 54 18 52 Z" 
          fill="url(#goldGrad)" filter="url(#glow)"/>
    
    <!-- Wheels -->
    <circle cx="29" cy="56" r="3.5" fill="#FFEFA8" stroke="#111" stroke-width="1.5"/>
    <circle cx="61" cy="56" r="3.5" fill="#FFEFA8" stroke="#111" stroke-width="1.5"/>
    
    <!-- Speed Swoosh / Wings -->
    <path d="M 25 38 C 35 34 55 34 65 38" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 16 63 L 74 63" stroke="url(#goldSheen)" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Stars below -->
    <polygon points="45,67 47,72 52,72 48,75 50,80 45,77 40,80 42,75 38,72 43,72" fill="url(#goldGrad)"/>
    <polygon points="34,68 35,71 39,71 36,73 37,77 34,75 31,77 32,73 29,71 33,71" fill="url(#goldGrad)" transform="scale(0.85) translate(8, 10)"/>
    <polygon points="56,68 57,71 61,71 58,73 59,77 56,75 53,77 54,73 51,71 55,71" fill="url(#goldGrad)" transform="scale(0.85) translate(14, 10)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(115, 20)">
    <!-- Main Title -->
    <text x="0" y="38" font-family="'Outfit', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" font-size="34" letter-spacing="3.5" fill="url(#goldGrad)" filter="url(#glow)">
      VARMA
    </text>
    <text x="160" y="38" font-family="'Outfit', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="800" font-size="34" letter-spacing="3" fill="#FFFFFF">
      CAR
    </text>
    <text x="250" y="38" font-family="'Outfit', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" font-size="34" letter-spacing="3.5" fill="url(#goldGrad)">
      TRAVELS
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="3" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" 
          font-weight="600" font-size="11.5" letter-spacing="3.8" fill="#F3CA68">
      COMFORT • SAFETY • PUNCTUALITY
    </text>
    
    <!-- Subtle Golden Divider -->
    <line x1="2" y1="46" x2="385" y2="46" stroke="url(#goldSheen)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
