<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="carensBody" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="carensHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="studioLight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#05080E" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="wheelRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="80%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="360" rx="16" fill="url(#studioLight)"/>
  
  <path d="M0 270 L600 270 M0 300 L600 300" stroke="#1E293B" stroke-width="1" stroke-dasharray="8 8"/>
  <ellipse cx="300" cy="275" rx="240" ry="25" fill="#030712" opacity="0.9" filter="url(#carShadow)"/>

  <!-- Badge Top Right -->
  <g transform="translate(450, 25)">
    <rect width="125" height="30" rx="15" fill="#1E293B" stroke="url(#goldAcc)" stroke-width="1.5"/>
    <text x="62" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FBBF24" text-anchor="middle">6 + 1 SEATER</text>
  </g>

  <!-- Category Badge Top Left -->
  <g transform="translate(25, 25)">
    <rect width="110" height="26" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
    <text x="55" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FBBF24" text-anchor="middle">LUXURY TECH MPV</text>
  </g>

  <!-- Car Body: Kia Carens -->
  <g id="car-carens" transform="translate(25, 32)">
    <!-- Roof Rails -->
    <path d="M 160 74 L 410 76" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <rect x="175" y="76" width="10" height="6" fill="#334155"/>
    <rect x="295" y="77" width="10" height="6" fill="#334155"/>
    <rect x="395" y="77" width="10" height="6" fill="#334155"/>

    <!-- Sharp, Futuristic MPV Lines -->
    <path d="M 45 208 
             C 45 152, 62 130, 112 94 
             C 130 86, 170 80, 220 78 
             L 405 80 
             C 440 110, 470 148, 495 162 
             L 538 174 
             C 555 180, 560 198, 555 218 
             L 542 228 
             L 512 228 
             C 506 202, 475 186, 448 186 
             C 420 186, 390 202, 384 228 
             L 195 228 
             C 190 202, 160 186, 133 186 
             C 106 186, 75 202, 70 228 
             L 42 228 
             C 38 220, 39 212, 45 208 Z" 
          fill="url(#carensBody)" stroke="#475569" stroke-width="1.5"/>

    <!-- Windows (Sleek Glasshouse with Star-map D-pillar garnish) -->
    <path d="M 116 98 
             L 210 86 
             L 400 86 
             C 425 110, 458 142, 472 156 
             L 102 156 
             C 88 135, 98 112, 116 98 Z" 
          fill="#090D16" stroke="#334155" stroke-width="1.5"/>

    <!-- Pillars -->
    <path d="M 215 86 L 210 156" stroke="#1E293B" stroke-width="6"/>
    <path d="M 325 86 L 320 156" stroke="#1E293B" stroke-width="6"/>
    <path d="M 420 105 L 426 156" stroke="#1E293B" stroke-width="5"/>
    <path d="M 108 104 L 102 156" stroke="#1E293B" stroke-width="6"/>

    <!-- Chrome Beltline & D-Pillar Accent (Kia signature) -->
    <path d="M 102 156 L 472 156" stroke="#E2E8F0" stroke-width="2.5"/>
    <path d="M 102 156 L 115 100" stroke="#E2E8F0" stroke-width="3"/>

    <!-- Window Tint Sheen -->
    <path d="M 140 96 L 380 96 L 350 114 L 130 114 Z" fill="#38BDF8" opacity="0.12"/>

    <!-- Body Surface Razor Crease -->
    <path d="M 70 170 Q 280 166 525 178" stroke="#94A3B8" stroke-width="2.5" fill="none"/>
    <path d="M 68 205 Q 280 198 535 208" stroke="#334155" stroke-width="2" fill="none"/>

    <!-- Doors & Handles (Flush look) -->
    <path d="M 320 156 L 316 228" stroke="#1E293B" stroke-width="1.2"/>
    <path d="M 205 156 L 200 228" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="220" y="166" width="22" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="330" y="166" width="22" height="4" rx="2" fill="#E2E8F0"/>

    <!-- Carens Star-map LED DRL Headlights (Distinctive modern Y-split) -->
    <path d="M 478 158 L 542 170 C 552 178 554 190 548 198 L 504 194 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 490 166 L 536 174 L 542 186 L 528 186" stroke="#38BDF8" stroke-width="2.5" fill="none"/>
    <circle cx="525" cy="184" r="3.5" fill="#FFFFFF"/>

    <!-- Star Map Rear Connected Tail Lamp -->
    <path d="M 45 198 L 47 132 C 55 132 64 142 64 156 L 58 198 Z" fill="#EF4444" stroke="#DC2626" stroke-width="1"/>
    <path d="M 48 135 L 56 165 L 48 195" stroke="#F87171" stroke-width="2" fill="none"/>

    <!-- Lower Cladding with Chrome Insert -->
    <path d="M 185 224 L 395 224" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>

    <!-- Dual-Tone Crystal Cut Alloy Wheels -->
    <g transform="translate(133, 228)">
      <circle cx="0" cy="0" r="39" fill="#020617" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="34" fill="#0F172A"/>
      <circle cx="0" cy="0" r="26" fill="url(#wheelRim)" stroke="#E2E8F0" stroke-width="1.5"/>
      <path d="M0 -24 L0 24 M-24 0 L24 0 M-17 -17 L17 17 M-17 17 L17 -17" stroke="#F1F5F9" stroke-width="3"/>
      <circle cx="0" cy="0" r="7" fill="#F59E0B"/>
    </g>

    <g transform="translate(448, 228)">
      <circle cx="0" cy="0" r="39" fill="#020617" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="34" fill="#0F172A"/>
      <circle cx="0" cy="0" r="26" fill="url(#wheelRim)" stroke="#E2E8F0" stroke-width="1.5"/>
      <path d="M0 -24 L0 24 M-24 0 L24 0 M-17 -17 L17 17 M-17 17 L17 -17" stroke="#F1F5F9" stroke-width="3"/>
      <circle cx="0" cy="0" r="7" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Model Nameplate at Bottom -->
  <text x="300" y="325" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="800" font-size="18" fill="#F1F5F9" letter-spacing="1.5" text-anchor="middle">
    KIA CARENS
  </text>
  <text x="300" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#94A3B8" letter-spacing="1" text-anchor="middle">
    6+1 SEATER • MODERN LUXURY • AIR PURIFIER • 6 AIRBAGS SAFETY
  </text>
</svg>
