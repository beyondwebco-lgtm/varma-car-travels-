<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="dzireBody" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="dzireGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="studioLight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2A3342" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="wheelRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="80%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="360" rx="16" fill="url(#studioLight)"/>
  
  <!-- Subtle Grid lines -->
  <path d="M0 270 L600 270 M0 300 L600 300" stroke="#1E293B" stroke-width="1" stroke-dasharray="8 8"/>
  <ellipse cx="300" cy="275" rx="240" ry="25" fill="#030712" opacity="0.8" filter="url(#carShadow)"/>

  <!-- Badge Top Right -->
  <g transform="translate(450, 25)">
    <rect width="125" height="30" rx="15" fill="#1E293B" stroke="url(#goldAcc)" stroke-width="1.5"/>
    <text x="62" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FBBF24" text-anchor="middle">4 + 1 SEATER</text>
  </g>

  <!-- Category Badge Top Left -->
  <g transform="translate(25, 25)">
    <rect width="90" height="26" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
    <text x="45" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FBBF24" text-anchor="middle">COMPACT SEDAN</text>
  </g>

  <!-- Car Body: Maruti Suzuki Dzire -->
  <g id="car-dzire" transform="translate(30, 40)">
    <!-- Main Body Silhouette -->
    <!-- Rear Trunk -->
    <path d="M 65 200 
             C 65 178, 85 168, 120 166 
             L 175 165 
             C 210 120, 260 100, 325 98 
             L 405 100 
             C 435 125, 465 165, 480 175 
             L 510 182 
             C 525 188, 532 205, 528 220 
             L 515 228 
             L 490 228 
             C 485 205, 455 190, 430 190 
             C 405 190, 375 205, 370 228 
             L 210 228 
             C 205 205, 175 190, 150 190 
             C 125 190, 95 205, 90 228 
             L 60 228 
             C 55 220, 58 205, 65 200 Z" 
          fill="url(#dzireBody)" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Windows (Cab) -->
    <path d="M 180 162 
             C 215 125, 255 106, 320 104 
             L 395 106 
             C 422 128, 448 160, 458 168 
             L 320 168 
             L 180 162 Z" 
          fill="url(#dzireGlass)" stroke="#64748B" stroke-width="1.5"/>

    <!-- Window Pillar Split -->
    <path d="M 315 104 L 315 168" stroke="#334155" stroke-width="7"/>
    <path d="M 215 132 L 225 165" stroke="#334155" stroke-width="4"/>

    <!-- Window Reflection Highlight -->
    <path d="M 230 115 L 380 115 L 360 130 L 220 130 Z" fill="#FFFFFF" opacity="0.15"/>

    <!-- Character Lines / Creases -->
    <path d="M 115 178 Q 300 178 505 192" stroke="#CBD5E1" stroke-width="2.5" fill="none"/>
    <path d="M 85 208 Q 300 205 515 212" stroke="#94A3B8" stroke-width="1.5" fill="none"/>

    <!-- Door Seams -->
    <path d="M 312 168 L 310 228" stroke="#64748B" stroke-width="1.2"/>
    <path d="M 205 165 L 200 228" stroke="#64748B" stroke-width="1.2"/>
    <!-- Door Handles with chrome highlight -->
    <rect x="220" y="174" width="22" height="5" rx="2.5" fill="#FFFFFF" stroke="#475569" stroke-width="0.8"/>
    <rect x="330" y="174" width="22" height="5" rx="2.5" fill="#FFFFFF" stroke="#475569" stroke-width="0.8"/>

    <!-- Headlight (Dzire sleek projector) -->
    <path d="M 470 176 L 515 183 C 522 188 525 198 520 205 L 485 200 Z" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5"/>
    <polygon points="495,183 515,188 505,198 488,194" fill="#38BDF8" opacity="0.7"/>

    <!-- Taillight -->
    <path d="M 64 195 C 62 182 72 172 82 172 L 95 174 L 88 198 L 65 198 Z" fill="#EF4444" stroke="#DC2626" stroke-width="1"/>
    <polygon points="75,176 88,177 82,192 72,192" fill="#F87171" opacity="0.8"/>

    <!-- Front Grille & Fog Light -->
    <path d="M 505 208 L 525 210 L 518 226 L 498 224 Z" fill="#1E293B"/>
    <circle cx="510" cy="217" r="4" fill="#FBBF24"/>

    <!-- Rear Wheel -->
    <g transform="translate(150, 228)">
      <circle cx="0" cy="0" r="38" fill="#0F172A" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="34" fill="#1E293B"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="25" fill="url(#wheelRim)" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Spokes -->
      <path d="M0 -23 L0 23 M-23 0 L23 0 M-16 -16 L16 16 M-16 16 L16 -16" stroke="#E2E8F0" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="7" fill="#F59E0B"/>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(430, 228)">
      <circle cx="0" cy="0" r="38" fill="#0F172A" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="34" fill="#1E293B"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="25" fill="url(#wheelRim)" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Spokes -->
      <path d="M0 -23 L0 23 M-23 0 L23 0 M-16 -16 L16 16 M-16 16 L16 -16" stroke="#E2E8F0" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="7" fill="#F59E0B"/>
    </g>

    <!-- Chrome Side Accent Strip -->
    <path d="M 195 225 L 385 225" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Model Nameplate at Bottom -->
  <text x="300" y="325" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="800" font-size="18" fill="#F1F5F9" letter-spacing="1.5" text-anchor="middle">
    MARUTI SUZUKI DZIRE
  </text>
  <text x="300" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#94A3B8" letter-spacing="1" text-anchor="middle">
    4+1 SEATER • CHILLED AC • 378L BOOT • DUAL AIRBAGS
  </text>
</svg>
